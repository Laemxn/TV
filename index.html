<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - Fondo Blur</title>
  
  <meta http-equiv="refresh" content="300">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: black; width: 100vw; height: 100vh; }

    .slider { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
    .slides { display: flex; width: 500%; height: 100%; animation: carrusel 25s infinite; }
    
    .slide-item {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Imagen de fondo desenfocada que cubre todo el marco */
    .bg-blur {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(20px) brightness(0.5);
      transform: scale(1.1); /* Evita bordes blancos al desenfocar */
    }

    /* Imagen frontal nítida completa */
    .img-front {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    @keyframes carrusel {
      0%   { margin-left: 0; }
      16%  { margin-left: 0; }

      20%  { margin-left: -100vw; }
      36%  { margin-left: -100vw; }

      40%  { margin-left: -200vw; }
      56%  { margin-left: -200vw; }

      60%  { margin-left: -300vw; }
      76%  { margin-left: -300vw; }

      80%  { margin-left: -400vw; }
      96%  { margin-left: -400vw; }

      100% { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides">

      <div class="slide-item">
        <img class="bg-blur" src="imagen1.jpg?v=1" alt="">
        <img class="img-front" src="imagen1.jpg?v=1" alt="1">
      </div>

      <div class="slide-item">
        <img class="bg-blur" src="imagen2.jpg?v=1" alt="">
        <img class="img-front" src="imagen2.jpg?v=1" alt="2">
      </div>

      <div class="slide-item">
        <img class="bg-blur" src="imagen3.jpg?v=1" alt="">
        <img class="img-front" src="imagen3.jpg?v=1" alt="3">
      </div>

      <div class="slide-item">
        <img class="bg-blur" src="imagen4.jpg?v=1" alt="">
        <img class="img-front" src="imagen4.jpg?v=1" alt="4">
      </div>

      <div class="slide-item">
        <img class="bg-blur" src="imagen5.jpg?v=1" alt="">
        <img class="img-front" src="imagen5.jpg?v=1" alt="5">
      </div>

    </div>
  </div>

</body>
</html>
