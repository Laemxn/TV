<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV Local</title>
  
  <!-- Recarga la página automáticamente cada 300 segundos (5 minutos) en HTML puro -->
  <meta http-equiv="refresh" content="300">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    /* Contenedor principal a pantalla completa */
    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Franja con las 5 imágenes animadas mediante CSS */
    .slides {
      display: flex;
      width: 500%;
      height: 100%;
      animation: carrusel 25s infinite;
    }

    /* Tamaño de cada imagen */
    .slides img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* Animación de cambio de imagen en CSS puro */
    @keyframes carrusel {
      0%   { margin-left: 0; }
      16%  { margin-left: 0; }

      20%  { margin-left: -100vw; }
      36%  { margin-left: -100vw; }

      40%  { margin-left: -200vw; }
      56%  { margin-left: -200vw; }

      60%  { margin-left: -200vw; }
      76%  { margin-left: -300vw; }

      80%  { margin-left: -400vw; }
      96%  { margin-left: -400vw; }

      100% { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides">
      <img src="imagen1.jpg" alt="Imagen 1">
      <img src="imagen2.jpg" alt="Imagen 2">
      <img src="imagen3.jpg" alt="Imagen 3">
      <img src="imagen4.jpg" alt="Imagen 4">
      <img src="imagen5.jpg" alt="Imagen 5">
    </div>
  </div>

</body>
</html>
