<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla TV - Carrusel</title>
  
  <!-- Recarga la página automáticamente cada 5 minutos -->
  <meta http-equiv="refresh" content="300">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 500%;
      height: 100%;
      animation: carrusel 25s infinite;
    }

    /* Ajuste perfecto de la imagen a la pantalla */
    .slides img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;      /* Muestra la imagen COMPLETA sin recortar bordes */
      object-position: center;   /* Centra la imagen en pantalla */
      background-color: black;  /* Rellena con fondo negro a los lados si sobra espacio */
    }

    /* Animación de cambio entre las 5 imágenes */
    @keyframes carrusel {
      0%   { margin-left: 0; }
      16%  { margin-left: 0; }

      20%  { margin-left: -100vw; }
      36%  { margin-left: -100vw; }

      40%  { margin-left: -200vw; }
      56%  { margin-left: -200vw; }

      60%  { margin-left: -300vw; }
      76%  { margin-left: -300vw; }

      80%  { margin-left: -400vw; }
      96%  { margin-left: -400vw; }

      100% { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides">
      <img src="imagen1.jpg?v=1" alt="Imagen 1">
      <img src="imagen2.jpg?v=1" alt="Imagen 2">
      <img src="imagen3.jpg?v=1" alt="Imagen 3">
      <img src="imagen4.jpg?v=1" alt="Imagen 4">
      <img src="imagen5.jpg?v=1" alt="Imagen 5">
    </div>
  </div>

</body>
</html>
